name: Public examples quality

on:
  push:
    branches: [Principal]
  pull_request:
    branches: [Principal]

jobs:
  typescript-examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
